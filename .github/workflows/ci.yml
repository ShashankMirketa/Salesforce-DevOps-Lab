name: Salesforce CI
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  validate:
    name: Validate Salesforce Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: |
          npm install --global @salesforce/cli

      - name: Show CLI version
        run: |
          sf --version

      - name: Check Salesforce Project
        run: |
          sf project generate manifest --source-dir force-app --output-dir manifest

      - name: Intentional CI Failure
        run: |
          echo "Testing PR CI failure"
          exit 1
